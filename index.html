<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寿司郎计价器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: sticky;
            top: 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .total-price {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            /* margin: 15px 0; */
        }

        .total-label {
            font-size: 16px;
            color: #666;
        }

        .price-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .price-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .price-item:hover {
            transform: translateY(-2px);
        }

        .price-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .color-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(0,0,0,0.2);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .price-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .counter-btn.minus {
            background: #f1f1f1;
            color: #333;
        }

        .counter-btn.plus {
            background: #667eea;
            color: white;
        }

        .counter-btn:hover {
            transform: scale(1.1);
        }

        .counter-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .counter-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            min-width: 40px;
            text-align: center;
        }

        .actions {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
        }

        .reset-btn:hover {
            background: #c0392b;
        }

        .container-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .price-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
            font-size: 16px; /* 防止iOS自动放大 */
        }

        .price-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #5568d3;
        }

        .container-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .container-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .container-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container-icon {
            width: 35px;
            height: 35px;
            background: #95a5a6;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .container-price {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .total-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        .total-count {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .stats-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            font-size: 15px;
            color: #666;
        }

        .stats-text {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stats-text span {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .stats-divider {
            color: #ddd;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .header {
                padding: 20px 15px;
                top: 10px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 22px;
            }

            .total-price {
                font-size: 36px;
            }

            .total-count {
                font-size: 16px;
            }

            .price-item {
                padding: 12px 15px;
                gap: 10px;
            }

            .color-dot {
                width: 30px;
                height: 30px;
                border-width: 2px;
            }

            .price-text {
                font-size: 16px;
            }

            .counter {
                gap: 8px;
            }

            .counter-btn {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }

            .counter-value {
                font-size: 20px;
                min-width: 30px;
            }

            .section-title {
                font-size: 16px;
            }

            .add-container {
                flex-direction: column;
                gap: 8px;
            }

            .add-btn {
                width: 100%;
                padding: 14px;
            }

            .price-input {
                padding: 14px;
            }

            .container-item {
                padding: 12px;
                gap: 8px;
            }

            .container-icon {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }

            .container-price {
                font-size: 14px;
            }

            .container-item .counter {
                gap: 6px;
            }

            .container-item .counter-btn {
                width: 34px;
                height: 34px;
                font-size: 18px;
            }

            .container-item .counter-value {
                font-size: 18px;
                min-width: 25px;
            }

            .container-item .delete-btn {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }

            .stats-row {
                font-size: 14px;
                gap: 12px;
                margin-top: 12px;
            }

            .stats-text span {
                font-size: 15px;
            }

            .actions {
                padding: 15px;
            }

            .action-btn {
                padding: 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍣 寿司郎计价器</h1>
            <div class="total-info">
                <div class="total-label">总计</div>
                <div class="total-price" id="totalPrice">0</div>
                <div class="total-label">元</div>
            </div>
            <div class="stats-row">
                <span class="stats-text">碟子 <span id="totalPlates">0</span>个</span>
                <span class="stats-divider">|</span>
                <span class="stats-text">容器 <span id="totalContainers">0</span>个</span>
            </div>
        </div>

        <div class="price-list" id="priceList"></div>

        <div class="container-section">
            <div class="section-title">📦 自定义容器</div>
            <div class="add-container">
                <input type="number" id="containerPriceInput" class="price-input" placeholder="输入容器价格" min="0" step="0.01" onkeypress="if(event.key === 'Enter') addContainer()">
                <button class="add-btn" onclick="addContainer()">添加容器</button>
            </div>
            <div class="container-list" id="containerList"></div>
        </div>

        <div class="actions">
            <button class="action-btn reset-btn" onclick="resetAll()">🗑️ 清空</button>
        </div>
    </div>

    <script>
        const prices = [
            { price: 8, color: '#FFFFFF' },
            { price: 10, color: '#E74C3C' },
            { price: 15, color: '#BDC3C7' },
            { price: 20, color: '#F1C40F' },
            { price: 28, color: '#2C3E50' }
        ];

        let counts = [0, 0, 0, 0, 0];
        let containers = [];

        function renderPriceList() {
            const priceList = document.getElementById('priceList');
            priceList.innerHTML = '';

            prices.forEach((item, index) => {
                const priceItem = document.createElement('div');
                priceItem.className = 'price-item';
                priceItem.innerHTML = `
                    <div class="price-info">
                        <div class="color-dot" style="background-color: ${item.color}"></div>
                        <div class="price-text">${item.price} 元</div>
                    </div>
                    <div class="counter">
                        <button class="counter-btn minus" onclick="decrement(${index})">−</button>
                        <div class="counter-value" id="count-${index}">${counts[index]}</div>
                        <button class="counter-btn plus" onclick="increment(${index})">+</button>
                    </div>
                `;
                priceList.appendChild(priceItem);
            });
        }

        function increment(index) {
            counts[index]++;
            updateDisplay();
        }

        function decrement(index) {
            if (counts[index] > 0) {
                counts[index]--;
                updateDisplay();
            }
        }

        function updateDisplay() {
            let total = 0;
            let totalPlates = 0;
            let totalContainers = 0;

            counts.forEach((count, index) => {
                total += count * prices[index].price;
                totalPlates += count;
                document.getElementById(`count-${index}`).textContent = count;
            });

            containers.forEach((container, index) => {
                total += container.count * container.price;
                totalContainers += container.count;
                const countElement = document.getElementById(`container-count-${index}`);
                if (countElement) {
                    countElement.textContent = container.count;
                }
            });

            document.getElementById('totalPrice').textContent = total;
            document.getElementById('totalPlates').textContent = totalPlates;
            document.getElementById('totalContainers').textContent = totalContainers;
        }

        function resetAll() {
            if (confirm('确定要清空所有计数吗？')) {
                counts = [0, 0, 0, 0, 0];
                containers = [];
                renderContainerList();
                updateDisplay();
            }
        }

        function addContainer() {
            const priceInput = document.getElementById('containerPriceInput');
            const price = parseFloat(priceInput.value);

            if (isNaN(price) || price <= 0) {
                alert('请输入有效的容器价格');
                return;
            }

            // 检查是否已存在相同价格的容器
            const existingContainer = containers.find(c => c.price === price);
            if (existingContainer) {
                existingContainer.count++;
            } else {
                containers.push({ price: price, count: 1 });
            }

            priceInput.value = '';
            renderContainerList();
            updateDisplay();
        }

        function incrementContainer(index) {
            containers[index].count++;
            renderContainerList();
            updateDisplay();
        }

        function decrementContainer(index) {
            if (containers[index].count > 0) {
                containers[index].count--;
                if (containers[index].count === 0) {
                    containers.splice(index, 1);
                }
                renderContainerList();
                updateDisplay();
            }
        }

        function deleteContainer(index) {
            if (confirm('确定要删除这个容器吗？')) {
                containers.splice(index, 1);
                renderContainerList();
                updateDisplay();
            }
        }

        function renderContainerList() {
            const containerList = document.getElementById('containerList');
            containerList.innerHTML = '';

            containers.forEach((container, index) => {
                const containerItem = document.createElement('div');
                containerItem.className = 'container-item';
                containerItem.innerHTML = `
                    <div class="container-info">
                        <div class="container-icon">📦</div>
                        <div class="container-price">${container.price} 元</div>
                    </div>
                    <div class="counter">
                        <button class="counter-btn minus" onclick="decrementContainer(${index})">−</button>
                        <div class="counter-value" id="container-count-${index}">${container.count}</div>
                        <button class="counter-btn plus" onclick="incrementContainer(${index})">+</button>
                    </div>
                    <button class="delete-btn" onclick="deleteContainer(${index})">×</button>
                `;
                containerList.appendChild(containerItem);
            });

            if (containers.length === 0) {
                containerList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无容器，请添加</div>';
            }
        }

        // Initialize
        renderPriceList();
        renderContainerList();
    </script>
</body>
</html>
